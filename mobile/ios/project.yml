name: VisionSentinel
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

packages:
  VisionSentinelCore:
    path: .

targets:
  VisionSentinel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - VisionSentinel.entitlements
    dependencies:
      - package: VisionSentinelCore
    info:
      path: App/Info.plist
    entitlements:
      path: App/VisionSentinel.entitlements
    settings:
      base:
        # Replace with your own reverse-DNS bundle identifier and Apple Developer Team ID in Xcode.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.visionsentinel
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
