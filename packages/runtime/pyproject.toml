[project]
name = "vs-runtime"
version = "0.1.0"
description = "Vision Sentinel Topic engine, shared contracts, bundle builder, loop and watchdog"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mingyang Jin" }]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
]
keywords = ["camera", "vision", "ai-agents", "alerting", "rtsp", "onvif", "self-hosted"]
dependencies = ["pydantic>=2.7", "tomli-w>=1.0"]

# The CLI imports its peer packages (vs-streamhub, vs-notify, vs-ui, a harness driver) lazily.
# They depend on this package, so install them together through the workspace root (`uv sync`).
[project.scripts]
vision-sentinel = "vs_runtime.cli:main"

[project.urls]
Homepage = "https://github.com/MingyangJin/vision-sentinel"
Repository = "https://github.com/MingyangJin/vision-sentinel"
Issues = "https://github.com/MingyangJin/vision-sentinel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vs_runtime"]
