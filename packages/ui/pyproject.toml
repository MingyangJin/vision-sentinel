[project]
name = "vs-ui"
version = "0.1.0"
description = "Vision Sentinel Unified Web UI: live multi-camera wall, timeline, Topic workspace, Main Agent chat, and alert inbox"
license = "MIT"
authors = [{ name = "Mingyang Jin" }]
requires-python = ">=3.12"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
]
keywords = ["camera", "vision", "ai-agents", "alerting", "rtsp", "onvif", "self-hosted"]
dependencies = [
    "vs-runtime",
    "vs-streamhub",
    "vs-notify",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
vs-ui = "vs_ui.server:main"

[project.urls]
Homepage = "https://github.com/MingyangJin/vision-sentinel"
Repository = "https://github.com/MingyangJin/vision-sentinel"
Issues = "https://github.com/MingyangJin/vision-sentinel/issues"

[tool.uv.sources]
vs-runtime = { workspace = true }
vs-streamhub = { workspace = true }
vs-notify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vs_ui"]
artifacts = ["src/vs_ui/static/**"]
